<div class="mx-auto max-w-4xl flex-1 w-full">
  <div class="rounded-2xl border border-gray-100 bg-white shadow-md overflow-hidden">

    <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-100 bg-gray-50">
      <p class="text-base font-bold text-gray-900 tracking-wide uppercase">Order Summary</p>
    </div>

    <!-- Line items -->
    <div class="px-6 py-5 space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-500 font-medium">Subtotal</span>
        <span class="text-sm font-semibold text-gray-800">{{cartService.totals()?.subtotal | currency}}</span>
      </div>

      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-500 font-medium">Discount</span>
        <span class="text-sm font-semibold text-green-500">-{{cartService.totals()?.discount | currency}}</span>
      </div>

      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-500 font-medium">Delivery fee</span>
        <span class="text-sm font-semibold text-gray-800">{{cartService.totals()?.shipping | currency}}</span>
      </div>
    </div>

    <!-- Total -->
    <div class="mx-6 border-t border-gray-200"></div>
    <div class="flex items-center justify-between px-6 py-4">
      <span class="text-base font-bold text-gray-900">Total</span>
      <span class="text-xl font-extrabold text-orange-500">{{cartService.totals()?.total | currency}}</span>
    </div>

    <!-- Actions -->
    @if (location.path() !== '/checkout') {
    <div class="px-6 pb-6 flex flex-col gap-3">
      <button
        routerLink="/checkout"
        mat-flat-button
        class="w-full !rounded-xl !py-3 !text-sm !font-bold !bg-orange-500 !text-white hover:!bg-orange-600 transition-colors duration-200 shadow-sm">
        Proceed to Checkout
      </button>
      <button
        routerLink="/shop"
        mat-button
        class="w-full !rounded-xl !py-2 !text-sm !font-medium !text-gray-500 hover:!text-orange-500 transition-colors duration-200">
        Continue Shopping
      </button>
    </div>
    }

  </div>
</div>
