<div class="flex mt-32 gap-6 px-4">

  <!-- Stepper Column -->
  <div class="w-3/4">
    <mat-stepper
      (selectionChange)="onStepChange($event)"
      [linear]="true"
      #stepper
      class="!rounded-2xl !border !border-gray-100 !shadow-md overflow-hidden">

      <!-- Step 1: Address -->
      <mat-step label="Address" [completed]="completionStatus().address">
        <div class="px-6 py-6 space-y-5">

          @if (mockStripe) {
          <div class="flex items-start gap-3 rounded-xl border border-orange-200 bg-orange-50 px-4 py-3">
            <span class="mt-0.5 text-orange-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M12 2a10 10 0 100 20A10 10 0 0012 2z" />
              </svg>
            </span>
            <div class="flex-1 space-y-2">
              <p class="text-xs font-semibold text-orange-700">Mock Mode Active — Dummy address will be used</p>
              <input type="text" disabled value="123 Test St"
                class="block w-full rounded-lg border border-orange-100 bg-white px-3 py-2 text-sm text-gray-500 shadow-sm" />
              <input type="text" disabled value="Test City, Test State, US"
                class="block w-full rounded-lg border border-orange-100 bg-white px-3 py-2 text-sm text-gray-500 shadow-sm" />
            </div>
          </div>
          } @else {
          <div id="address-element"></div>
          }

          <div class="flex items-center">
            <mat-checkbox
              [checked]="saveAddress"
              (change)="onSaveAddressCheckboxChange($event)"
              class="text-sm text-gray-600">
              Save as default address
            </mat-checkbox>
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-gray-100">
            <button class="z-0 !rounded-xl !text-sm !text-gray-500 hover:!text-orange-500 transition-colors"
              routerLink="/shop" mat-stroked-button>
              Continue shopping
            </button>
            <button
              [disabled]="!completionStatus().address"
              class="z-0 !rounded-xl !text-sm !bg-orange-500 !text-white hover:!bg-orange-600 disabled:!opacity-50 transition-colors shadow-sm"
              matStepperNext mat-flat-button>
              Next
            </button>
          </div>

        </div>
      </mat-step>

      <!-- Step 2: Shipping -->
      <mat-step label="Shipping" [completed]="completionStatus().delivery">
        <div class="px-6 py-6 space-y-5">

          <app-checkout-delivery
            (deliveryComplete)="handleDeliveryChange($event)">
          </app-checkout-delivery>

          <div class="flex items-center justify-between pt-2 border-t border-gray-100">
            <button mat-stroked-button
              class="!rounded-xl !text-sm !text-gray-500 hover:!text-orange-500 transition-colors"
              matStepperPrevious>
              Back
            </button>
            <button
              [disabled]="!completionStatus().delivery"
              class="!rounded-xl !text-sm !bg-orange-500 !text-white hover:!bg-orange-600 disabled:!opacity-50 transition-colors shadow-sm"
              matStepperNext mat-flat-button>
              Next
            </button>
          </div>

        </div>
      </mat-step>

      <!-- Step 3: Payment -->
      <mat-step label="Payment" [completed]="completionStatus().card">
        <div class="px-6 py-6 space-y-5">

          @if (mockStripe) {
          <div class="flex items-start gap-3 rounded-xl border border-orange-200 bg-orange-50 px-4 py-3">
            <span class="mt-0.5 text-orange-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M12 2a10 10 0 100 20A10 10 0 0012 2z" />
              </svg>
            </span>
            <div class="flex-1 space-y-2">
              <p class="text-xs font-semibold text-orange-700">Mock Mode Active — Dummy credit card will be used</p>
              <input type="text" disabled value="**** **** **** 4242"
                class="block w-full rounded-lg border border-orange-100 bg-white px-3 py-2 text-sm text-gray-500 shadow-sm" />
              <div class="flex gap-2">
                <input type="text" disabled value="12/30"
                  class="block w-1/2 rounded-lg border border-orange-100 bg-white px-3 py-2 text-sm text-gray-500 shadow-sm" />
                <input type="text" disabled value="123"
                  class="block w-1/2 rounded-lg border border-orange-100 bg-white px-3 py-2 text-sm text-gray-500 shadow-sm" />
              </div>
            </div>
          </div>
          } @else {
          <div id="payment-element"></div>
          }

          <div class="flex items-center justify-between pt-2 border-t border-gray-100">
            <button mat-stroked-button
              class="!rounded-xl !text-sm !text-gray-500 hover:!text-orange-500 transition-colors"
              matStepperPrevious>
              Back
            </button>
            <button
              [disabled]="!completionStatus().card"
              class="!rounded-xl !text-sm !bg-orange-500 !text-white hover:!bg-orange-600 disabled:!opacity-50 transition-colors shadow-sm"
              matStepperNext mat-flat-button>
              Next
            </button>
          </div>

        </div>
      </mat-step>

      <!-- Step 4: Confirmation -->
      <mat-step label="Confirmation">
        <div class="px-6 py-6 space-y-5">

          <app-checkout-review
            [confirmationToken]="confirmationToken">
          </app-checkout-review>

          <div class="flex items-center justify-between pt-2 border-t border-gray-100">
            <button class="z-0 !rounded-xl !text-sm !text-gray-500 hover:!text-orange-500 transition-colors"
              matStepperPrevious mat-stroked-button>
              Back
            </button>
            <button
              [disabled]="!confirmationToken || loading"
              (click)="confirmPayment(stepper)"
              class="z-0 !rounded-xl !text-sm !bg-orange-500 !text-white hover:!bg-orange-600 disabled:!opacity-50 transition-colors shadow-sm min-w-[10rem] flex items-center justify-center gap-2"
              mat-flat-button>
              @if (loading) {
              <mat-spinner diameter="18"></mat-spinner>
              } @else {
              <span>Pay {{cartService.totals()?.total | currency}}</span>
              }
            </button>
          </div>

        </div>
      </mat-step>

    </mat-stepper>
  </div>

  <!-- Sidebar -->
  <div class="w-1/4">
    <app-order-summary></app-order-summary>
  </div>

</div>
