<div class="group flex items-center gap-5 rounded-2xl border border-gray-100 bg-white p-4 shadow-sm hover:shadow-md transition-shadow duration-300 mb-4">

  <!-- Product Image -->
  <a routerLink="/shop/{{item().productId}}" class="shrink-0">
    <div class="w-28 h-28 rounded-xl overflow-hidden border border-gray-100 bg-gray-50">
      <img
        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
        src="{{item().pictureUrl}}"
        alt="product image"
      />
    </div>
  </a>

  <!-- Info -->
  <div class="flex flex-1 flex-col gap-2 min-w-0">
    <a routerLink="/shop/{{item().productId}}"
       class="text-sm font-semibold text-gray-800 hover:text-orange-500 transition-colors duration-200 truncate leading-snug">
      {{item().productName}}
    </a>

    <!-- Remove button -->
    <button
      (click)="removeItemFromCart()"
      mat-button
      class="self-start !px-0 !min-w-0 text-gray-400 hover:text-red-500 transition-colors duration-200 flex items-center gap-1 text-xs">
      <mat-icon class="!text-base !w-4 !h-4">delete_outline</mat-icon>
      <span>Remove</span>
    </button>
  </div>

  <!-- Quantity Controls -->
  <div class="flex items-center gap-2 shrink-0">
    <button
      mat-icon-button
      (click)="decrementQuantity()"
      class="!w-8 !h-8 !min-w-0 rounded-full border border-gray-200 bg-gray-50 hover:bg-orange-50 hover:border-orange-300 transition-all duration-200 flex items-center justify-center">
      <mat-icon class="!text-base text-gray-600">remove</mat-icon>
    </button>

    <span class="w-7 text-center text-base font-bold text-gray-900">{{item().quantity}}</span>

    <button
      mat-icon-button
      (click)="incrementQuantity()"
      class="!w-8 !h-8 !min-w-0 rounded-full border border-gray-200 bg-gray-50 hover:bg-orange-50 hover:border-orange-300 transition-all duration-200 flex items-center justify-center">
      <mat-icon class="!text-base text-gray-600">add</mat-icon>
    </button>
  </div>

  <!-- Price -->
  <div class="shrink-0 w-24 text-right">
    <span class="text-lg font-extrabold text-orange-500">{{item().price | currency}}</span>
  </div>

</div>
