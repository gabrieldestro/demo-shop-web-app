<div class="flex flex-col h-full bg-white rounded-lg">
  <div class="px-6 py-4">
    <h3 class="text-2xl font-bold text-gray-800 m-0">Refine Your Search</h3>
    <p class="text-sm text-gray-500 mt-1">Select the brands and types you want to see.</p>
  </div>
  
  <mat-divider></mat-divider>
  
  <div class="flex gap-8 p-6 overflow-y-auto max-h-[60vh]">
    <div class="w-1/2">
      <h4 class="font-semibold text-sm text-gray-400 mb-4 uppercase tracking-wider">Brands</h4>
      <mat-selection-list [(ngModel)]="selectedBrands" [multiple]="true" class="border border-gray-100 rounded-lg shadow-sm bg-white">
        @for (brand of data.brands; track brand) {
          <mat-list-option [value]="brand" class="border-b border-gray-50 last:border-0 hover:bg-gray-50">{{brand}}</mat-list-option>
        }
      </mat-selection-list>
    </div>
    <div class="w-1/2">
      <h4 class="font-semibold text-sm text-gray-400 mb-4 uppercase tracking-wider">Types</h4>
      <mat-selection-list [(ngModel)]="selectedTypes" [multiple]="true" class="border border-gray-100 rounded-lg shadow-sm bg-white">
        @for (type of data.types; track type) {
          <mat-list-option [value]="type" class="border-b border-gray-50 last:border-0 hover:bg-gray-50">{{type}}</mat-list-option>
        }
      </mat-selection-list>
    </div>
  </div>
  
  <mat-divider></mat-divider>
  
  <div class="flex justify-between items-center px-6 py-4 bg-gray-50 rounded-b-lg">
    <button mat-stroked-button (click)="clearFilters()">Clear</button>
    <button mat-flat-button color="primary" (click)="applyFilters()">Apply Filters</button>
  </div>
</div>
