<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden">

    <div class="bg-black px-8 py-8 text-center">
      <h1 class="text-3xl font-extrabold text-white">Create account</h1>
      <p class="text-gray-400 text-sm mt-1">Join us to start shopping</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="px-10 py-8 space-y-5">

      <app-text-input label="First name" formControlName="firstName" />
      <app-text-input label="Last name" formControlName="lastName" />
      <app-text-input label="Email address" formControlName="email" />
      <app-text-input label="Password" formControlName="password" type="password" />

      @if (validationErrors.length > 0) {
        <div class="mb-3 p-4 bg-red-100 text-red-500 rounded-xl">
          <ul class="list-disc px-3">
            @for (error of validationErrors; track error) {
              <li>{{error}}</li>
            }
          </ul>
        </div>
      }

      <div class="px-4">
        <button type="submit"
          [disabled]="registerForm.invalid"
          class="w-full bg-orange-500 hover:bg-orange-600 active:scale-95 transition-all text-white font-bold text-sm py-2.5 rounded-xl disabled:opacity-50 disabled:cursor-not-allowed">
          Create account
        </button>
      </div>

      <p class="text-center text-sm text-gray-500 pt-2">
        Already have an account?
        <a routerLink="/account/login" class="text-orange-500 font-semibold hover:underline">Sign in</a>
      </p>

    </form>
  </div>
</div>
